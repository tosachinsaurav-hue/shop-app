<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B5E">

<link rel="manifest" href="manifest.webmanifest">

<title>दुकान ऐप · Shop App</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--bg:#F5F3EF;--card:#fff;--ink:#1B1A17;--muted:#5E5A53;--line:#E4E0D8;--pri:#0E6B5E;--pri-ink:#fff;--soft:#E3F2EF;--seg:#E7E3DC;--bad:#B3261E;--bad-bg:#FDECEA;--warn-bg:#FCEBD6;--warn:#8A4A04;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121311;--card:#1C1D1A;--ink:#ECEAE5;--muted:#A9A49B;--line:#33342F;--pri:#3FA592;--pri-ink:#07201B;--soft:#17302B;--seg:#2C2D29;--bad:#F2867E;--bad-bg:#3A1D1A;--warn-bg:#3A2A12;--warn:#F2C27D;color-scheme:dark}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 Inter,"Noto Sans Devanagari",system-ui,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px;font:700 17px "Space Grotesk",Inter,"Noto Sans Devanagari",sans-serif}
.logo{width:36px;height:36px;border-radius:11px;background:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
.seg{display:flex;background:var(--seg);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:36px;padding:0 12px;font:600 13px Inter,"Noto Sans Devanagari",sans-serif;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
main{flex:1;display:flex;justify-content:center;padding:8px 16px 40px}
.box{width:min(440px,100%);display:flex;flex-direction:column;gap:16px}
h1{margin:6px 0 0;font:700 27px/1.15 "Space Grotesk",Inter,"Noto Sans Devanagari",sans-serif}
h2{margin:0;font:700 18px/1.25 Inter,"Noto Sans Devanagari",sans-serif}
p{margin:0}.muted{color:var(--muted)}.sm{font-size:13px}.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
form.card{gap:13px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input.i{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:50px;padding:0 14px;font:500 16px Inter,"Noto Sans Devanagari",sans-serif;color:var(--ink);width:100%}
input.i:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.pw{position:relative}.pw input{padding-right:70px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--pri);font:600 13px Inter,"Noto Sans Devanagari",sans-serif;min-height:40px;padding:0 10px;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;min-height:52px;padding:0 16px;font:700 16px Inter,"Noto Sans Devanagari",sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.wa{background:#1F8A4C;border-color:#1F8A4C;color:#fff}
.btn[disabled]{opacity:.55;cursor:wait}
.link{border:0;background:none;color:var(--pri);font:600 14px Inter,"Noto Sans Devanagari",sans-serif;cursor:pointer;padding:8px 2px;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 150px}
.err{color:var(--bad);font-size:14px;font-weight:600}
.msg{border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600}
.msg.bad{background:var(--bad-bg);color:var(--bad)}.msg.ok{background:var(--soft);color:var(--pri)}.msg.warn{background:var(--warn-bg);color:var(--warn)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--pri)}
.creds{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline;background:var(--soft);border-radius:14px;padding:14px 16px}
.creds span{font-size:13px;color:var(--muted)}.creds b{font:700 20px/1.2 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.user{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 8px;cursor:pointer;color:var(--ink);font:600 14px Inter,"Noto Sans Devanagari",sans-serif}
.user[aria-pressed=true]{border-color:var(--pri);background:var(--soft)}
.user .av{width:44px;height:44px;border-radius:50%;background:var(--seg);display:flex;align-items:center;justify-content:center;font:700 18px Inter,sans-serif}
.user[aria-pressed=true] .av{background:var(--pri);color:var(--pri-ink)}
.user small{font-weight:500;color:var(--muted);font-size:12px}
.wait{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);padding:40px 0}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--pri);animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.hero{display:flex;flex-direction:column;gap:6px;padding:8px 2px 4px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span><span id="brand"></span></div>
  <div class="seg" role="group" aria-label="Language / भाषा"><button type="button" data-l="hi" lang="hi">हिंदी</button><button type="button" data-l="en" lang="en">EN</button></div>
</div>
<main><div class="box" id="view" aria-live="polite"><div class="wait"><span class="spin"></span></div></div></main>

function idb() { return new Promise(res => { try { const r = indexedDB.open('shopapp-auth', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } }); }
async function kv(op, key, val) {
  const d = await idb(); if (!d) return null;
  return new Promise(res => { try { const s = d.transaction('kv', op === 'get' ? 'readonly' : 'readwrite').objectStore('kv'); const q = op === 'get' ? s.get(key) : op === 'put' ? s.put(val, key) : s.delete(key); q.onsuccess = () => res(q.result); q.onerror = () => res(null); } catch (e) { res(null); } });
}

const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const ITER = 100000;
async function derive(pw, salt, iter) {
  const k = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(salt), iterations: iter, hash: 'SHA-256' }, k, 256));
}
const verOf = async d => b64(await crypto.subtle.digest('SHA-256', d));

/* ================================================================ server */
async function api(a, body) {
  if (!CFG.api || /YOUR|example/.test(CFG.api)) throw new Error('noApi');
  const ctl = 'AbortController' in window ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 30000) : 0;
  try {
    const r = await fetch(CFG.api, { method: 'POST', body: JSON.stringify(Object.assign({ a }, body)), signal: ctl ? ctl.signal : undefined, redirect: 'follow' });
    if (!r.ok) throw new Error('server');
    return await r.json();
  } catch (e) {
    if (e && (e.message === 'server' || e.message === 'noApi')) throw e;
    throw new Error(navigator.onLine === false ? 'offline' : 'offline');
  } finally { clearTimeout(timer); }
}
async function proofFor(u, pw) { const s = await api('salt', { u }); if (!s.ok) throw new Error(s.err || 'server'); return { proof: b64(await derive(pw, s.salt, s.iter)), u: s.u || u }; }

async function doRegister() {
  const v = id => $(id).value.trim();
  const form = { shop: v('rShop'), owner: v('rOwner'), phone: digits($('rPhone').value).slice(-10), city: v('rCity'), username: v('rUser').toLowerCase(), email: v('rEmail').toLowerCase() };
  const pw = $('rPass').value;
  const again = f => show('register', {}, [f]);
  if (!form.shop || !form.owner) return again('e_fill');
  if (!/^[6-9]\d{9}$/.test(form.phone)) return again('e_phone');
  if (!okUser(form.username)) return again('e_username');
  if (pw.length < 8) return again('e_short');
  if (!okEmail(form.email)) return again('e_email');
  if (!$('rAgree').checked) return again('e_agree');
  busy = true; paint();
  try {
    const inf = info();
    const p = await makePass(pw);
    regPend = Object.assign({}, form, { pw, p, agree: true, kind: AND ? 'apk' : 'web', dev: inf ? inf.dev : '', model: inf ? inf.model : '', ver: inf ? String(inf.ver) : '' });
    const r = await api('registerStart', regBody());
    if (!r.ok) throw new Error(r.err);
    show('regCode', { to: r.to });
  } catch (e) { busy = false; show('register', {}, [errKey(e)]); }
}
const regBody = () => ({ shop: regPend.shop, owner: regPend.owner, phone: regPend.phone, city: regPend.city, username: regPend.username, email: regPend.email, pass: regPend.p.pass, pw: regPend.pw, agree: true, kind: regPend.kind, dev: regPend.dev, model: regPend.model, ver: regPend.ver });
async function doRegCode() {
  const code = digits($('rcCode').value);
  if (code.length !== 6) return show('regCode', data, ['e_badCode']);
  busy = true; paint();
  try {
    const r = await api('register', Object.assign(regBody(), { code }));
    if (!r.ok) throw new Error(r.err);
    let sess = null;
    if (AND) sess = await takeSession(r, regPend.p.proof, regPend.pw);
    pref.set('lastUser', r.me.u);
    const pw = regPend.pw; regPend = null;
    show('done', { shopName: r.shop.name, shopId: r.shop.id, u: r.me.u, pw, till: r.shop.till, sess });
  } catch (e) { busy = false; show('regCode', data, [errKey(e)]); }
}
function regFill() { // back to the form with what was typed
  if (!regPend) return;
  const set = (id, x) => { const i = $(id); if (i) i.value = x || ''; };
  set('rShop', regPend.shop); set('rOwner', regPend.owner); set('rPhone', regPend.phone); set('rCity', regPend.city); set('rUser', regPend.username); set('rPass', regPend.pw); set('rEmail', regPend.email);
  const a = $('rAgree'); if (a) a.checked = true;
}

async function doLogin() {
  const u = $('lU').value.trim(), pw = $('lP').value;
  if (!u || !pw) return show('login', { u }, ['e_fill']);
  busy = true; paint();
  try {
    const pf = await proofFor(u, pw), proof = pf.proof;
    const inf = info();
    const r = await api('login', { u: pf.u, proof, pw, kind: AND ? 'apk' : 'web', dev: inf ? inf.dev : '', model: inf ? inf.model : '', ver: inf ? String(inf.ver) : '' });
    if (!r.ok) throw new Error(r.err);
    pref.set('lastUser', r.me.u);
    if (!AND) return show('welcome', { shop: r.shop, me: r.me });
    const sess = await takeSession(r, proof, pw);
    await enter(sess);
  } catch (e) { busy = false; show('login', { u }, [errKey(e)]); }
}

/** Store what the server sent for this phone and switch the phone on. */
async function takeSession(r, proof, pw) {
  const res = AND.activate(r.act, r.key, r.keyId || '');
  if (res !== 'ok') throw new Error('server');
  pref.set('relogin', ''); // a full online login clears "must log in again"
  await saveShop({ id: r.shop.id, name: r.shop.name, status: r.shop.status, till: r.shop.till, maxPhones: r.shop.maxPhones, users: r.users, cfg: r.cfg, lastSync: Date.now(), stop: '', needEmail: !!r.needEmail });
  return { u: r.me.u, name: r.me.name, role: r.me.role, proof, pw };
}

async function doForgotStart() {
  const u = $('fU').value.trim();
  if (!u) return show('forgot', { u }, ['e_fill']);
  busy = true; paint();
  try {
    const r = await api('resetStart', { u, dev: DEV });
    if (!r.ok) throw new Error(r.err);
    show('forgot', { u: r.u || u, step: 2, sent: r.to });
  } catch (e) { busy = false; const k = errKey(e); show('forgot', { u, wa: ['e_noEmail', 'e_expired', 'e_shopBlocked', 'e_stopped', 'e_mail'].includes(k) }, [k]); }
}
async function doForgot() {
  const u = $('fU').value.trim(), code = digits($('fC').value), pw = $('fP').value;
  const keep = { u, step: 2, sent: data.sent };
  if (!u || code.length !== 6) return show('forgot', keep, ['e_fill']);
  if (pw.length < 8) return show('forgot', keep, ['e_short']);
  busy = true; paint();
  try {
    const p = await makePass(pw);
    const r = await api('reset', { u, code, pass: p.pass, pw, dev: DEV });
    if (!r.ok) throw new Error(r.err);
    show('login', { u: r.u || u }, ['e_resetDone'.slice(2), 'ok']);
  } catch (e) { busy = false; show('forgot', keep, [errKey(e)]); }
}
async function doAddEmail() {
  const sess = data.sess; if (!sess) return;
  busy = true; paint();
  try {
    if (!data.to) {
      const email = $('emE').value.trim().toLowerCase();
      if (!okEmail(email)) { busy = false; return show('addEmail', { sess }, ['e_email']); }
      const r = await api('emailStart', { u: sess.u, proof: sess.proof, dev: DEV, email });
      if (!r.ok) throw new Error(r.err);
      return show('addEmail', { sess, email, to: r.to });
    }
    const code = digits($('emC').value);
    const r = await api('emailVerify', { u: sess.u, proof: sess.proof, dev: DEV, code });
    if (!r.ok) throw new Error(r.err);
    cache.shop.needEmail = false; await saveShop(cache.shop);
    await enter(sess);
  } catch (e) { busy = false; show('addEmail', data, [errKey(e)]); }
}

async function doUnlock() {
  const me = (cache.shop.users || []).find(u => u.u === data.sel);
  if (!me) return show('unlock', {}, ['pickUser']);
  const pw = $('uP').value;
  if (!pw) return;
  // the helper refused this login last time: with internet, check it online instead of on the phone
  const re = String(pref.get('relogin', '')).split('|');
  if (re[0] === me.u && navigator.onLine !== false) return show('login', { u: me.u }, [re[1] || 'changedPw']);
  let fails = +pref.get('unlockFails', 0), lockedTill = +pref.get('unlockLock', 0);
  if (lockedTill > Date.now()) return show('unlock', { sel: me.u }, ['e_locked']);
  busy = true; paint();
  try {
    const d = await derive(pw, me.salt, me.iter);
    if (await verOf(d) !== me.ver) {
      fails++; pref.set('unlockFails', fails);
      if (fails >= 6) pref.set('unlockLock', Date.now() + 60000 * Math.min(15, fails - 5));
      return show('unlock', { sel: me.u }, [fails >= 3 ? 'changedPw' : 'e_wrongPin']);
    }
    pref.set('unlockFails', 0); pref.set('lastUser', me.u);
    await enter({ u: me.u, name: me.name, role: me.role, proof: b64(d), pw });
  } catch (e) { busy = false; show('unlock', { sel: me.u }, [errKey(e)]); }
}

/* ================================================================ sync with the server */
async function syncNow(sess) {
  const inf = info() || {};
  let ops = (await kv('get', 'ops')) || [];
  const left = [];
  let offline = false;
  for (const op of ops) {
    if (offline || op.by !== sess.u) { left.push(op); continue; }
    try {
      const r = await api(op.a, Object.assign({}, op.body, { u: sess.u, proof: sess.proof, dev: DEV }));
      if (r.ok && op.a === 'addStaff' && r.uname && r.uname !== op.body.uname) {
        const x = (cache.shop.users || []).find(u => u.u === op.body.uname); if (x) x.u = r.uname;
      }
      if (!r.ok && (r.err === 'busy' || r.err === 'server')) left.push(op);
    } catch (e) { offline = true; left.push(op); }
  }
  await kv('put', 'ops', left);
  if (offline) return { offline: true };
  let r;
  const allDays = (await kv('get', 'days')) || [], sent = (await kv('get', 'sentDays')) || {};
  const days = allDays.filter(x => x && sent[x.d] !== x.b + '|' + x.s);
  try { r = await api('ping', { u: sess.u, proof: sess.proof, pw: sess.pw || undefined, dev: DEV, ver: String(inf.ver || ''), days }); }
  catch (e) { return { offline: true }; }
  if (!r.ok) return { err: r.err };
  delete sess.pw;
  if (days.length) { const keepFrom = new Date(Date.now() - 40 * 864e5).toISOString().slice(0, 10); for (const k in sent) if (k < keepFrom) delete sent[k]; days.forEach(x => { sent[x.d] = x.b + '|' + x.s; }); await kv('put', 'sentDays', sent); }
  const shop = Object.assign({}, cache.shop || {});
  if (r.stop && r.stop !== 'stopped') {
    AND.deactivate();
    shop.stop = r.stop; await saveShop(shop);
    return { stop: r.stop };
  }
  if (r.act) AND.activate(r.act, r.key, r.keyId || '');
  Object.assign(shop, { id: r.shop.id, name: r.shop.name, status: r.shop.status, till: r.shop.till, maxPhones: r.shop.maxPhones, cfg: r.cfg, lastSync: Date.now(), stop: '', needEmail: !!r.needEmail });
  if (!left.length) shop.users = r.users;
  await saveShop(shop);
  if (r.stop === 'stopped') return { stop: 'stopped' };
  if (r.shop.status === 'expired') return { stop: 'expired' };
  return { ok: true };
}

/* ================================================================ open the shop app */
async function enter(sess) {
  show('loading');
  let key = AND.appKey();
  // 2.1.1: phones set up before 2.1 don't know yet whether the owner's email is missing, so ask the helper first.
  const emailUnknown = sess.role === 'owner' && cache.shop && cache.shop.needEmail === undefined;
  if ((!key || emailUnknown) && navigator.onLine !== false) {
    const s = await syncNow(sess);
    if (s.stop === 'stopped') return show('unlock', {}, ['e_stopped']);
    if (s.stop) return show('stop', { kind: s.stop === 'shopBlocked' || s.stop === 'phoneBlocked' ? s.stop : s.stop });
    if (s.err === 'wrong' || s.err === 'loginShop') { pref.set('relogin', sess.u + '|' + (s.err === 'wrong' ? 'changedPw' : 'e_loginShop')); return show('login', { u: sess.u }, [s.err === 'wrong' ? 'changedPw' : 'e_loginShop']); }
    key = AND.appKey();
  }
  if (sess.role === 'owner' && cache.shop && cache.shop.needEmail && navigator.onLine !== false) return show('addEmail', { sess });
  if (!key) {
    const inf = info() || {};
    const ended = cache.shop && cache.shop.status === 'expired';
    return show('stop', { kind: ended ? 'expired' : 'renew', till: inf.till });
  }
  try { await openApp(sess, key); }
  catch (e) { show('fatal', { k: e && e.message === 'offline' ? 'e_broken' : 'e_broken' }); }
}

async function getEnc() {
  try { const r = await fetch('app.enc?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (e) {}
  try { const c = await caches.match(new URL('app.enc', location.href).href); if (c) return await c.json(); } catch (e) {}
  throw new Error('offline');
}

async function openApp(sess, keyB64) {
  const pkg = await getEnc();
  const key = await crypto.subtle.importKey('raw', unb64(keyB64), { name: 'AES-GCM' }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(pkg.iv), additionalData: te.encode('app|' + pkg.keyId) }, key, unb64(pkg.data));
  const html = td.decode(plain);
  const listeners = new Set();
  const notify = () => listeners.forEach(f => { try { f(); } catch (e) {} });
  let syncing = null;
  const inf0 = info() || {};
  const status = () => {
    const s = cache.shop || {}, inf = info() || {}, cfg = s.cfg || {};
    const now = new Date(); const tk = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
    const left = ymd => { if (!ymd || ymd === '0') return null; const a = Date.UTC(+ymd.slice(0, 4), +ymd.slice(4, 6) - 1, +ymd.slice(6, 8)); const b = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()); return Math.round((a - b) / 864e5); };
    return {
      shopId: s.id, shopName: s.name, plan: s.status, till: s.till, planDaysLeft: s.till ? left(s.till.replace(/-/g, '')) : null,
      offlineDaysLeft: left(inf.till), online: navigator.onLine !== false, lastSync: s.lastSync || 0, pending: pendingCount,
      update: !!(cfg.latest && +inf.ver && cfg.latest > +inf.ver), apk: cfg.apk || CFG.apk || '', support: digits(cfg.support || CFG.support || ''), today: tk
    };
  };
  let pendingCount = ((await kv('get', 'ops')) || []).length;
  async function queue(op) {
    const ops = (await kv('get', 'ops')) || [];
    ops.push(Object.assign({ id: Date.now() + '-' + Math.random().toString(36).slice(2), by: sess.u, at: Date.now() }, op));
    await kv('put', 'ops', ops); pendingCount = ops.length; notify();
  }
  async function sync() {
    if (syncing) return syncing;
    syncing = (async () => {
      const r = await syncNow(sess);
      pendingCount = ((await kv('get', 'ops')) || []).length;
      // The helper refused this login: the phone must log in again with internet (no quick unlock), so it can't loop.
      if (r.err === 'wrong' || r.err === 'loginShop') pref.set('relogin', sess.u + '|' + (r.err === 'wrong' ? 'changedPw' : 'e_loginShop'));
      if (r.stop || r.err === 'wrong' || r.err === 'loginShop') { pref.set('flash', r.stop === 'stopped' ? 'e_stopped' : r.err === 'wrong' ? 'changedPw' : r.err === 'loginShop' ? 'e_loginShop' : ''); setTimeout(() => location.reload(), 300); }
      notify();
      return r;
    })().finally(() => { syncing = null; });
    return syncing;
  }
  const cleanUsers = () => (cache.shop.users || []).map(u => ({ u: u.u, name: u.name, role: u.role, status: u.status, pending: !!u.pending }));
  function slug(name) { return String(name).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]/g, '').slice(0, 12) || 'staff'; }
  const AUTH = {
    user: sess.u, name: sess.name, role: sess.role, shopId: cache.shop.id, shopName: cache.shop.name, expires: cache.shop.till || '',
    status, users: cleanUsers,
    onChange(f) { listeners.add(f); return () => listeners.delete(f); },
    lock() { location.reload(); },
    logout() { location.reload(); },
    sync,
    report(days) { if (!Array.isArray(days)) return; kv('put', 'days', days.slice(0, 31)); },
    openUpdate() { const u = status().apk; if (u) AND.open(new URL(u, location.href).href); },
    async addStaff(name) {
      if (sess.role !== 'owner') throw new Error('ownerOnly');
      name = String(name || '').trim().slice(0, 40); if (!name) throw new Error('fill');
      const base = String(cache.shop.id).toLowerCase() + '-' + slug(name);
      let uname = base, i = 2; while ((cache.shop.users || []).some(u => u.u === uname)) uname = base + (i++);
      const pin = staffPin(), p = await makePass(pin);
      cache.shop.users = (cache.shop.users || []).concat([{ u: uname, role: 'staff', name, status: 'active', salt: p.pass.salt, iter: p.pass.iter, ver: p.pass.ver, pending: true }]);
      await saveShop(cache.shop);
      await queue({ a: 'addStaff', body: { name, uname, pass: p.pass, pin } });
      sync();
      notify();
      return { uname, pin, name };
    },
    async setStaff(uname, what) {
      if (sess.role !== 'owner') throw new Error('ownerOnly');
      const x = (cache.shop.users || []).find(u => u.u === uname && u.role === 'staff'); if (!x) throw new Error('bad');
      const body = { target: uname }; let pin = null;
      if (what === 'stop' || what === 'allow') { body.status = what === 'stop' ? 'stopped' : 'active'; x.status = body.status; }
      if (what === 'pin') { pin = staffPin(); const p = await makePass(pin); body.pass = p.pass; body.pin = pin; Object.assign(x, p.pass); }
      x.pending = true;
      await saveShop(cache.shop);
      await queue({ a: 'setUser', body });
      sync(); notify();
      return { pin, uname, name: x.name };
    },
    async changePass(oldPw, newPw) {
      if (String(newPw || '').length < 8) throw new Error('short');
      const me = (cache.shop.users || []).find(u => u.u === sess.u);
      if (!me || await verOf(await derive(oldPw, me.salt, me.iter)) !== me.ver) throw new Error('wrong');
      const p = await makePass(newPw);
      const r = await api('changePass', { u: sess.u, proof: sess.proof, dev: DEV, pass: p.pass, pw: newPw });
      if (!r.ok) throw new Error(r.err);
      sess.proof = p.proof; cache.shop.users = r.users; await saveShop(cache.shop); notify();
      return true;
    },
    async phones() {
      const r = await api('devices', { u: sess.u, proof: sess.proof, dev: DEV });
      if (!r.ok) throw new Error(r.err); return r;
    },
    async removePhone(id) {
      const r = await api('removeDevice', { u: sess.u, proof: sess.proof, dev: DEV, target: id });
      if (!r.ok) throw new Error(r.err); return r;
    },
    credText(c) { return tr('credMsg', { shop: cache.shop.name, id: cache.shop.id, u: c.uname, p: c.pin, link: location.origin + location.pathname }); }
  };
  window.SHOP_AUTH = Object.freeze(AUTH);
  window.SHOP_PWA = 1;
  // lock when the app comes back after a while (Android tells us how long it was away)
  window.__shopResume = ms => { if (ms > LOCK_MS) location.reload(); else sync(); };
  document.open(); document.write(html); document.close();
  // listeners added before document.open are dropped by it, so add them now
  window.addEventListener('online', () => sync());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') pref.set('hiddenAt', Date.now()); });
  setInterval(() => { if (navigator.onLine !== false) sync(); }, 10 * 60 * 1000);
  setTimeout(() => sync(), 1500);
  void inf0;
}

/* ================================================================ events */
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.l; pref.set('gateLang', lang); paint(); }));
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act],[data-sel],[data-show],[data-copy]');
  if (!t) return;
  if (t.dataset.go) { e.preventDefault(); const u = ($('lU') && $('lU').value) || ($('fU') && $('fU').value) || data.u || ''; show(t.dataset.go, t.dataset.go === 'unlock' ? { sel: pref.get('lastUser', '') } : { u }); return; }
  if (t.dataset.sel) { show('unlock', { sel: t.dataset.sel }); setTimeout(() => { const p = $('uP'); if (p) p.focus(); }, 30); return; }
  if (t.dataset.show) { const i = $(t.dataset.show); i.type = i.type === 'password' ? 'text' : 'password'; t.textContent = i.type === 'password' ? tr('show') : tr('hide'); return; }
  if (t.dataset.copy) { const v = t.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).catch(() => { const x = document.createElement('textarea'); x.value = v; document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); }).finally(() => { t.textContent = tr('copied'); setTimeout(() => { t.textContent = tr('copy'); }, 1500); }); return; }
  const a = t.dataset.act;
  if (a === 'genPw') { $('fP').value = ownerPw(); }
  if (a === 'genReg') { $('rPass').value = ownerPw(); }
  if (a === 'regResend' && regPend) { busy = true; paint(); api('registerStart', regBody()).then(r => show('regCode', { to: r.to || data.to }, r.ok ? ['codeSent', 'ok'] : [errKey(r.err)])).catch(e => show('regCode', data, [errKey(e)])); }
  if (a === 'regEdit') { show('register'); regFill(); }
  if (a === 'haveCode') show('forgot', { u: ($('fU') && $('fU').value.trim()) || data.u || '', step: 2 });
  if (a === 'emRestart') show('addEmail', { sess: data.sess });
  if (a === 'enterNew' && data.sess) enter(data.sess);
  if (a === 'reload') location.reload();
});
document.addEventListener('input', e => {
  if (e.target.id === 'fU' && $('askLink')) $('askLink').href = waLink(supportNo(), tr('askCodeMsg', { u: e.target.value.trim() }));
  if (e.target.id === 'rShop' && $('rUser') && !$('rUser').dataset.typed) $('rUser').value = suggestUser(e.target.value);
  if (e.target.id === 'rUser') e.target.dataset.typed = '1';
});
document.addEventListener('submit', e => {
  e.preventDefault(); if (busy) return;
  if (e.target.id === 'regF') doRegister();
  if (e.target.id === 'logF') doLogin();
  if (e.target.id === 'fgF') doForgot();
  if (e.target.id === 'fg1F') doForgotStart();
  if (e.target.id === 'rcF') doRegCode();
  if (e.target.id === 'emF') doAddEmail();
  if (e.target.id === 'unF') doUnlock();
});
W.codeSent = W.codeSent || ['Code sent.', 'कोड भेज दिया।'];
W.resetDone = W.resetDone || ['Password changed. Log in with the new password.', 'पासवर्ड बदल गया। नए पासवर्ड से लॉग इन करें।'];

/* ================================================================ start */
(async () => {
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
  if (!(window.crypto && crypto.subtle && window.indexedDB)) return show('fatal', { k: 'e_noCrypto' });
  cache.shop = await kv('get', 'shop');
  if (!AND) {
    show('home');
    try { const r = await api('config', {}); if (r.ok) { cache.cfg = r.cfg; if (screen === 'home') paint(); } } catch (e) {}
    return;
  }
  if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }
  const s = cache.shop;
  if (s && s.stop) return show('stop', { kind: s.stop === 'removed' ? 'removed' : s.stop });
  const fl = pref.get('flash', ''); pref.set('flash', '');
  const re = String(pref.get('relogin', '')).split('|');
  if (re[0] && s && (s.users || []).length && navigator.onLine !== false) return show('login', { u: re[0] }, [fl || re[1] || 'changedPw']);
  if (s && (s.users || []).length) return show('unlock', { sel: pref.get('lastUser', '') }, fl ? [fl, 'warn'] : null);
  show('aStart');
  try { const r = await api('config', {}); if (r.ok) { cache.cfg = r.cfg; if (screen === 'aStart') paint(); } } catch (e) {}
})();
}
